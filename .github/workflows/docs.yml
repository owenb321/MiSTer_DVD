name: docs

# Two jobs with two different jobs to do:
#
#   build  — the parity gate. Runs on every PR and every push to main that could
#            invalidate the manual, so `tools/docs_check.py` and
#            `mkdocs build --strict` fail fast, next to the change that broke them.
#   deploy — publishes to GitHub Pages, and ONLY when a release is published.
#
# ⚠ WHY THE SITE IS NOT DEPLOYED FROM `main` (changed 2026-09-09, by user
# decision): the manual is what a user reads while holding the .rbf from the
# latest release. Deploying every merge meant the published manual described
# options, buttons and formats that were not in ANY released core — the reader
# has no way to tell which half applies to them, and the "Unreleased" admonition
# convention put the burden on the writer to remember. A release event checks out
# the tagged commit, so what is published is exactly the manual for the core that
# was published with it.
#
# Consequence worth knowing: a doc fix merged to main does not reach users until
# the next release. To push one out sooner, publish the release again or dispatch
# this workflow **with the release tag as the ref** — never from main, which would
# reintroduce exactly the leak above:
#   gh workflow run docs.yml --ref v0.4.0

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'mkdocs.yml'
      - 'tools/docs_check.py'
      - 'dvd/emu.sv'          # CONF_STR is the OSD contract the manual is checked against
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'mkdocs.yml'
      - 'tools/docs_check.py'
      - 'dvd/emu.sv'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; the deploy job adds only what it needs.
permissions:
  contents: read

# Keyed on ref so a check build never queues behind a deploy. Never cancel a
# deployment mid-flight; check builds are cheap to cancel.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    name: Build the manual
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r site/requirements.txt

      # The OSD is the contract: every option, gamepad button and file extension
      # in dvd/emu.sv's CONF_STR must be documented. This is why dvd/emu.sv is in
      # the paths filter above — adding an option without documenting it must
      # fail even when no doc file was touched.
      - name: Check the manual against the OSD definition
        run: python3 tools/docs_check.py

      # --strict turns a broken cross-link into a build failure. Same command the
      # maintainer runs locally before committing.
      - name: Build
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
